<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherWise India</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="bg-image"></div>
        <aside class="sidebar glass">
            <h2 class="logo">WeatherWise</h2>
            <div class="status-card">
                <p class="label">Air Quality Status</p>
                <div class="graph-box">
                    <span class="trend" id="aqi-text">Loading...</span>
                    <div class="danger-tag" id="status-label">Normal</div>
                </div>
                <svg viewBox="0 0 100 40" class="mini-graph">
                    <path d="M0 35 Q 25 35, 50 20 T 100 5" fill="none" stroke="#ff9f43" stroke-width="2"/>
                </svg>
                <a href="#" class="more-link">See More details ></a>
            </div>
        </aside>
        <main class="main-content">
            <header>
                <div class="location-info">
                    <span class="icon">📍</span>
                    <span id="location-name">Loading...</span>
                    <span id="current-date">--</span>
                </div>
                <div class="top-nav">
                    <div class="search-bar">
                        <input type="text" id="cityInput" placeholder="Search city...">
                        <button id="searchBtn">🔍</button>
                    </div>
                </div>
            </header>
            <section class="hero-weather">
                <div class="temp-big"><span id="main-temp">--</span>°</div>
                <div class="high-low">
                    <div>H: <span id="temp-high">--</span>°</div>
                    <div>L: <span id="temp-low">--</span>°</div>
                </div>
                <div class="weather-desc">
                    <h1 id="description">Fetching...</h1>
                </div>
                <p class="ai-summary">Real-time data and advanced technology providing reliable forecasts for any location in India and around the world.</p>
            </section>
            <section class="forecast-row" id="forecast-container"></section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
